[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "B008",  # Permite Depends(), Query() en firmas de FastAPI
    "E712",  # Permite comparaciones de columnas booleanas de SQLAlchemy (Model.is_active == True)
    "E501",  # Permite líneas largas en cadenas de texto / docstrings
    "E741",  # Permite variables cortas como l
    "E402",  # Permite imports después de sys.path en scripts de migración
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["F841"]
